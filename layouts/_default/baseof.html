<!DOCTYPE html>
<html lang="{{ .Site.Language.Locale | default "en-US" }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | EarthBuild{{ end }}</title>
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  
  <!-- Canonical & Favicon -->
  <link rel="canonical" href="{{ .Permalink }}">
  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">

  <!-- Open Graph / Facebook / LinkedIn -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ .Permalink }}">
  <meta property="og:title" content="{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | EarthBuild{{ end }}">
  <meta property="og:description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  <meta property="og:image" content="{{ .Site.BaseURL }}images/logo-earthbuild.svg">

  <!-- Twitter Cards -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | EarthBuild{{ end }}">
  <meta name="twitter:description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  <meta name="twitter:image" content="{{ .Site.BaseURL }}images/logo-earthbuild.svg">

  <!-- Structured Data JSON-LD -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "EarthBuild",
    "applicationCategory": "DeveloperApplication",
    "operatingSystem": "Linux, macOS, Windows",
    "description": "{{ .Site.Params.description }}",
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "USD"
    },
    "url": "https://earthbuild.dev",
    "license": "https://www.mozilla.org/MPL/2.0/"
  }
  </script>

  <!-- Google Fonts Optimization: On-Interaction Optional Loading (Zero CLS / Zero TBT) -->
  <script>
    (() => {
      const events = ['pointermove', 'pointerdown', 'touchstart', 'scroll', 'keydown'];
      let loaded = false;
      function loadFonts() {
        if (loaded) return;
        loaded = true;
        events.forEach((e) => window.removeEventListener(e, loadFonts));
        const l = document.createElement('link');
        l.rel = 'stylesheet';
        l.href = 'https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&display=optional';
        document.head.appendChild(l);
      }
      events.forEach((e) => window.addEventListener(e, loadFonts, { once: true, passive: true }));
    })();
  </script>
  <noscript>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&display=optional">
  </noscript>

  <!-- Zero-Render-Blocking Critical CSS Inlined via Hugo Pipes for Sub-2s FCP -->
  {{ $css := resources.Get "css/style.css" | minify }}
  <style>{{ $css.Content | safeCSS }}</style>
</head>
<body>
  <div class="bg-grid-overlay"></div>

  {{ partial "nav.html" . }}

  <main id="main-content">
    {{ block "main" . }}{{ end }}
  </main>

  {{ partial "footer.html" . }}

  <!-- Interactive TypeScript (Inlined via Hugo Pipes / ESBuild for Single-Pass Initial Layout) -->
  {{ $opts := dict "targetPath" "js/bundle.js" "minify" true }}
  {{ $js := resources.Get "ts/main.ts" | js.Build $opts }}
  <script>{{ $js.Content | safeJS }}</script>
</body>
</html>
