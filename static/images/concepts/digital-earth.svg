<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <linearGradient id="globeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="digitalGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep space backdrop -->
  <rect width="400" height="400" rx="80" fill="#070B14"/>

  <!-- Earth Base Sphere -->
  <circle cx="200" cy="200" r="140" fill="url(#globeGrad)" stroke="#1E293B" stroke-width="4"/>

  <!-- Left Hemisphere (Day/Space Side - Subtle Continents) -->
  <g fill="#1E3A5F" opacity="0.8">
    <path d="M110 130 Q130 110 160 135 T170 180 T130 220 T95 190 Z"/>
    <path d="M120 225 Q145 235 155 270 T135 310 T115 280 Z"/>
    <path d="M80 160 Q95 140 105 160 T90 185 Z"/>
  </g>

  <!-- Terminator Division Line -->
  <line x1="200" y1="60" x2="200" y2="340" stroke="url(#digitalGlow)" stroke-width="2" opacity="0.6"/>

  <!-- Right Hemisphere (The Illuminated Digital Shadow) -->
  <g filter="url(#neonGlow)">
    <!-- Digital Latitude / Longitude Arc Rings -->
    <path d="M200 80 A120 120 0 0 1 320 200" stroke="#38BDF8" stroke-width="2.5" fill="none" opacity="0.5"/>
    <path d="M200 120 A80 80 0 0 1 280 200" stroke="#10B981" stroke-width="2.5" fill="none" opacity="0.7"/>
    <path d="M200 200 A120 120 0 0 1 200 320" stroke="#34D399" stroke-width="2.5" fill="none" opacity="0.5"/>

    <!-- Digital Circuit & DAG Pipeline Grid -->
    <g stroke="url(#digitalGlow)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- Main trunk -->
      <path d="M200 140 L240 140 L270 170 L315 170"/>
      <path d="M200 200 L230 200 L260 230 L290 230 L320 260"/>
      <path d="M200 260 L245 260 L275 290 L300 290"/>
      
      <!-- Cross connections -->
      <path d="M240 140 L260 180 L260 230"/>
      <path d="M270 170 L290 200 L290 230"/>
      <path d="M245 260 L245 290 L275 290"/>
    </g>

    <!-- Glowing Data Nodes / Container Blocks -->
    <g fill="#38BDF8">
      <circle cx="240" cy="140" r="5"/>
      <circle cx="270" cy="170" r="6"/>
      <circle cx="315" cy="170" r="4"/>
      <circle cx="260" cy="180" r="4"/>
    </g>

    <g fill="#10B981">
      <circle cx="230" cy="200" r="5"/>
      <circle cx="260" cy="230" r="6"/>
      <circle cx="290" cy="230" r="5"/>
      <circle cx="320" cy="260" r="4"/>
      <circle cx="245" cy="260" r="5"/>
      <circle cx="275" cy="290" r="6"/>
      <circle cx="300" cy="290" r="4"/>
    </g>

    <!-- Floating Container Hex/Cube in the digital field -->
    <g fill="none" stroke="#34D399" stroke-width="2.5">
      <polygon points="280,110 298,120 298,140 280,150 262,140 262,120"/>
      <line x1="280" y1="130" x2="280" y2="150"/>
      <line x1="280" y1="130" x2="298" y2="120"/>
      <line x1="280" y1="130" x2="262" y2="120"/>
    </g>
  </g>

  <!-- Atmospheric Glow Arc -->
  <path d="M198 60 A140 140 0 0 1 198 340" stroke="url(#digitalGlow)" stroke-width="4" fill="none" opacity="0.8" filter="url(#neonGlow)"/>
</svg>
