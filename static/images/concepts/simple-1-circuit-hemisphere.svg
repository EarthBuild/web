<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Left Side: Solid Earth Hemisphere (Deep/Cyan Blue) -->
  <path d="M 100 20 A 80 80 0 0 0 100 180 Z" fill="#0284C7"/>
  
  <!-- Right Side: Digital Shadow (3 Bold Circuit Tracks in Emerald & Cyan) -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Top Track (Cyan) -->
    <path d="M 106 50 L 140 50 L 160 70" stroke="#38BDF8" stroke-width="12"/>
    <circle cx="160" cy="70" r="10" fill="#38BDF8"/>

    <!-- Middle Track (Emerald - Longest) -->
    <path d="M 106 100 L 160 100" stroke="#10B981" stroke-width="12"/>
    <circle cx="168" cy="100" r="10" fill="#10B981"/>

    <!-- Bottom Track (Mint / Cyan) -->
    <path d="M 106 150 L 140 150 L 160 130" stroke="#34D399" stroke-width="12"/>
    <circle cx="160" cy="130" r="10" fill="#34D399"/>
  </g>
</svg>